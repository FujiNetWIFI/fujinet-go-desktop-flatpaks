name: Build and publish flatpaks

# Builds every FujiNet Go desktop app (GNOME and KDE frontends) from the
# source of its latest published release and publishes them all as one
# Flatpak remote on GitHub Pages (the gh-pages branch).
#
# Nothing else triggers a build: the schedule notices new releases within half
# an hour (planning is a few API calls; it builds only what is stale), and a
# release workflow can ask for an immediate run with
#   gh api repos/FujiNetWiFi/fujinet-go-desktop-flatpaks/dispatches -f event_type=app-released
# Which flatpaks are stale is decided by versions.json on gh-pages.

on:
  schedule:
    - cron: '*/30 * * * *'
  repository_dispatch:
    types: [app-released]
  workflow_dispatch:
    inputs:
      only:
        description: 'Build only this app (e.g. nes); empty = every stale one'
        required: false
        default: ''
      force:
        description: 'Rebuild even when the published version is current'
        type: boolean
        default: false

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # All three jobs run in ubuntu:24.04 containers on the org's self-hosted
  # runners (apt through the host cache), like the apps' own CI.
  plan:
    runs-on: [self-hosted, Linux, X64, fujinet-builder]
    container:
      image: ubuntu:24.04
      options: --add-host=host.docker.internal:host-gateway
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      count: ${{ steps.plan.outputs.count }}
    steps:
      - name: Install base tools
        shell: bash
        run: |
          MIRROR=http://mirrors.edge.kernel.org/ubuntu
          (echo > /dev/tcp/host.docker.internal/3142) 2>/dev/null \
            && MIRROR=http://host.docker.internal:3142/mirrors.edge.kernel.org/ubuntu
          sed -i "s|http://[a-z.]*ubuntu.com/ubuntu|$MIRROR|" /etc/apt/sources.list.d/ubuntu.sources
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates curl jq gh
      - uses: actions/checkout@v4

      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          ONLY: ${{ inputs.only }}
          FORCE: ${{ inputs.force }}
        run: scripts/plan.sh

  build:
    needs: plan
    if: needs.plan.outputs.count != '0'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: [self-hosted, Linux, X64, fujinet-builder]
    container:
      image: ubuntu:24.04
      options: --privileged --add-host=host.docker.internal:host-gateway
    steps:
      # --privileged: flatpak-builder's bubblewrap sandbox needs user namespaces.
      - name: Install flatpak and flatpak-builder
        shell: bash
        run: |
          MIRROR=http://mirrors.edge.kernel.org/ubuntu
          (echo > /dev/tcp/host.docker.internal/3142) 2>/dev/null \
            && MIRROR=http://host.docker.internal:3142/mirrors.edge.kernel.org/ubuntu
          sed -i "s|http://[a-z.]*ubuntu.com/ubuntu|$MIRROR|" /etc/apt/sources.list.d/ubuntu.sources
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates curl flatpak flatpak-builder elfutils unzip
          flatpak remote-add --if-not-exists --user flathub \
            https://dl.flathub.org/repo/flathub.flatpakrepo

      - uses: actions/checkout@v4
        with:
          repository: ${{ matrix.repo }}
          ref: ${{ matrix.tag }}
          path: src

      - name: Install the runtime and SDK this manifest targets
        working-directory: src
        run: |
          manifest="${{ matrix.manifest }}"
          runtime=$(sed -n 's/^runtime: *//p' "$manifest")
          runtime_version=$(sed -n "s/^runtime-version: *'\(.*\)'/\1/p" "$manifest")
          sdk=$(sed -n 's/^sdk: *//p' "$manifest")
          flatpak install -y --user flathub \
            "${runtime}/x86_64/${runtime_version}" \
            "${sdk}/x86_64/${runtime_version}"

      # --disable-rofiles-fuse because FUSE is not available to the runner user
      - name: Build and export to a local repo
        working-directory: src
        run: |
          # source downloads occasionally drop mid-TLS; the retry reuses what was fetched
          for attempt in 1 2 3; do
            flatpak-builder --user --force-clean --repo=repo \
              --disable-rofiles-fuse build-flatpak "${{ matrix.manifest }}" && exit 0
            echo "::warning::build attempt ${attempt} failed"
          done
          exit 1

      - name: Bundle into a single installable file
        working-directory: src
        run: |
          mkdir ../out
          flatpak build-bundle \
            --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo \
            repo "../out/${{ matrix.id }}.flatpak" "${{ matrix.id }}" master
          echo "${{ matrix.tag }}" > "../out/${{ matrix.id }}.tag"

      - uses: actions/upload-artifact@v4
        with:
          name: flatpak-${{ matrix.id }}
          path: out/*
          if-no-files-found: error

  publish:
    needs: [plan, build]
    # publish whatever built, even if some matrix jobs failed
    # and only ever from main: a dispatch from another branch builds but never
    # touches the public remote
    if: ${{ !cancelled() && needs.plan.outputs.count != '0' && github.ref == 'refs/heads/main' }}
    runs-on: [self-hosted, Linux, X64, fujinet-builder]
    container:
      image: ubuntu:24.04
      options: --add-host=host.docker.internal:host-gateway
    permissions:
      contents: write
    steps:
      - name: Install flatpak, ostree, gpg and git
        shell: bash
        run: |
          MIRROR=http://mirrors.edge.kernel.org/ubuntu
          (echo > /dev/tcp/host.docker.internal/3142) 2>/dev/null \
            && MIRROR=http://host.docker.internal:3142/mirrors.edge.kernel.org/ubuntu
          sed -i "s|http://[a-z.]*ubuntu.com/ubuntu|$MIRROR|" /etc/apt/sources.list.d/ubuntu.sources
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates curl jq gh gnupg flatpak ostree
      - uses: actions/checkout@v4
      - name: Mark the workspace safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: flatpak-*

      - name: Fetch the current remote
        run: |
          git clone --quiet --depth 1 --branch gh-pages \
            "https://github.com/${GITHUB_REPOSITORY}" site \
            || echo "no gh-pages branch yet"

      - name: Import, sign and push
        env:
          GPG_PRIVATE_KEY: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}
          PUSH_TOKEN: ${{ github.token }}
        run: scripts/publish.sh artifacts site

      - name: Make sure Pages serves gh-pages
        env:
          GH_TOKEN: ${{ secrets.PAGES_ADMIN_TOKEN || github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/pages" --jq .html_url >/dev/null 2>&1 \
            || echo "::warning::Pages is not enabled; set Settings > Pages > Source to the gh-pages branch"
